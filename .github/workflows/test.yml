name: Test

# Nightly on weekdays and on demand, never on a push or a pull request
# (owner decision, November 19, 2026). Changes are checked locally first by
# the pre-push hook in .githooks; this run is the safety net behind it, and
# a night when main has not moved since the last green run costs one short job.
on:
  schedule:
    - cron: '35 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quiet:
    # A scheduled run on a main that already passed is skipped; a dispatch always runs.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          wf=$(basename "${GITHUB_WORKFLOW_REF%%@*}")
          last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?event=schedule&status=success&branch=main&per_page=1" --jq '.workflow_runs[0].head_sha // ""')
          if [ "$last" = "$GITHUB_SHA" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "main is unchanged since the last green nightly ($last)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: quiet
    if: needs.quiet.outputs.run == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - name: The ES module entry is a fresh build of src
        run: npm run check
      - run: npm test
